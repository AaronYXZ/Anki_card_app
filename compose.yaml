services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: anki_card_app
      POSTGRES_USER: anki
      POSTGRES_PASSWORD: anki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anki -d anki_card_app"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
