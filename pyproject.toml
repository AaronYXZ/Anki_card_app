[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anki-card-app"
version = "0.1.0"
description = "AI-assisted spaced-repetition learning platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.116",
  "fsrs>=6.3.1,<7",
  "jinja2>=3.1",
  "markdown-it-py>=4.0",
  "openai>=1.99",
  "psycopg[binary]>=3.2",
  "pygments>=2.19",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.35",
]

[project.scripts]
anki-card-admin = "anki_card_app.admin:main"

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "mypy>=1.17",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-pygments>=2.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/anki_card_app"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["anki_card_app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["anki_card_app"]
