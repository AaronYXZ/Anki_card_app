{% extends "base.html" %}
{% block title %}Sign in · Anki Card App{% endblock %}
{% block content %}
  <section class="page-heading auth-panel">
    <p class="eyebrow">Private alpha</p>
    <h1>Sign in</h1>
    <p>Use the account provided with your invitation.</p>
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <form class="card-form" action="/login" method="post">
      <input type="hidden" name="csrf_token" value="{{ request.scope.get('csrf_token', '') }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Email <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <div class="actions"><button class="button primary" type="submit">Sign in</button></div>
    </form>
  </section>
{% endblock %}
