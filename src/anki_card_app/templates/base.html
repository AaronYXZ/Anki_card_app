<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#245c45">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>{% block title %}Anki Card App{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='/icon-192.png') }}">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script src="{{ url_for('static', path='/app.js') }}" defer></script>
    {% block head_extra %}{% endblock %}
  </head>
  <body id="top">
    <header class="site-header">
      <a class="brand" href="/">Anki Card App</a>
      {% if request.scope.get("auth_user") %}
        <nav aria-label="Primary navigation">
          <details class="nav-group" name="primary-nav-group">
            <summary>Create</summary>
            <div class="nav-dropdown">
              <a href="/imports">Import</a>
              <a href="/cards/new">New card</a>
              <a href="/notes">Imported notes</a>
            </div>
          </details>
          <a class="nav-link" href="/review">Review</a>
          <details class="nav-group" name="primary-nav-group">
            <summary>Modify</summary>
            <div class="nav-dropdown">
              <a href="/cards/drafts">Drafts</a>
              <a href="/cards">Cards</a>
            </div>
          </details>
          <details class="nav-group" name="primary-nav-group">
            <summary>Utils</summary>
            <div class="nav-dropdown nav-dropdown-right">
              <a href="/exports/backup.json">Export</a>
              <a href="/install">Install</a>
              <a href="/restore">Restore</a>
              <form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ request.scope.get('csrf_token', '') }}"><button class="nav-button" type="submit">Sign out</button></form>
            </div>
          </details>
          <a class="nav-link favorite-nav-link" href="/favorites" aria-label="Favorites" title="Favorites">&#10084;&#65039;</a>
        </nav>
      {% endif %}
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
