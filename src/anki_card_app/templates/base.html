<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Anki Card App{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    {% block head_extra %}{% endblock %}
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Anki Card App</a>
      <nav aria-label="Primary navigation">
        <a href="/notes">Notes</a>
        <a href="/imports">Imports</a>
        <a href="/cards/new">New card</a>
        <a href="/cards/drafts">Drafts</a>
        <a href="/review">Review</a>
      </nav>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
